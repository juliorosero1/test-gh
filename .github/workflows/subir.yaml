name: Despliegue a DockerHub

# Se ejecuta solo al hacer push a la rama principal
on:
  push:
    branches: [master] # ⚠️ Cambia 'main' por tu rama si tiene otro nombre

jobs:
  desplegar:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    
    steps:
      # Paso 1: Descargar el código del repositorio
      - name: Obtener código fuente
        uses: actions/checkout@v4

      # Paso 2: Autenticarse en Docker Hub con token (no contraseña)
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Genera este token en Docker Hub > Security

      # Paso 3: Compilar la imagen y subirla automáticamente
      - name: Compilar y subir imagen a Docker Hub
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}